
paths:
  # IMPORTANT: Update these paths after running the download scripts
  tuh_eeg_dir: 'data/TUH_EEG'
  chb_mit_dir: '/Users/mihaibogdandeaconu/Documents/data/CHB-MIT'
  # List of EEG file paths for training. For a real project, this would be
  # generated by scanning the data directories.
  train_files: ['/Users/mihaibogdandeaconu/Documents/data/CHB-MIT/chb01/chb01_01.edf', '/Users/mihaibogdandeaconu/Documents/data/CHB-MIT/chb01/chb01_02.edf', '/Users/mihaibogdandeaconu/Documents/data/CHB-MIT/chb01/chb01_03.edf', '/Users/mihaibogdandeaconu/Documents/data/CHB-MIT/chb01/chb01_04.edf']
  val_files: ['/Users/mihaibogdandeaconu/Documents/data/CHB-MIT/chb01/chb01_06.edf']
  output_dir: 'outputs/'       # For saving plots and predictions
  model_save_dir: 'saved_models/' # For saving trained model weights

# --- Data Preprocessing (The "Data Refinery") ---
preprocessing:
  sfreq: 256                # Target sampling frequency
  l_freq: 0.5               # High-pass filter cutoff (Hz)
  h_freq: 70.0              # Low-pass filter cutoff (Hz)
  notch_freq: 60.0          # Powerline frequency for notch filter (use 50.0 for Europe)
  epoch_duration_s: 10      # Duration of each epoch in seconds
  epoch_overlap_s: 5        # Overlap between consecutive epochs
  reject_threshold_uv: 200  # Reject epochs with peak-to-peak amplitude > this value (in microvolts)
  montage: 'standard_1020'  # MNE standard montage to use

# --- Model Architecture ---
model:
  # Shared CNN-Transformer Backbone
  num_eeg_channels: 21      # Number of EEG channels after montage selection (e.g., 10-20 system)
  sequence_length: 2560     # sfreq * epoch_duration_s
  cnn_out_channels: 64      # Output channels from the final CNN layer (becomes embedding dim)
  transformer_heads: 8      # Number of attention heads in the Transformer
  transformer_layers: 6     # Number of Transformer encoder layers
  transformer_ff_dim: 1024  # Hidden dimension of the Transformer's feed-forward network
  dropout: 0.2

  # Multi-Task Learning Heads
  tasks:
    rhythm:
      num_classes: 5        # Delta, Theta, Alpha, Beta, Gamma
      class_names: ['Delta', 'Theta', 'Alpha', 'Beta', 'Gamma']
    artifact:
      num_classes: 4        # Ocular, EMG, ECG, Electrode Pop
      class_names: ['Ocular', 'EMG', 'ECG', 'Electrode Pop']
    pathology:
      num_classes: 3        # Normal, Seizure, Spike
      class_names: ['Normal', 'Seizure', 'Spike']
    localization:
      num_classes: 5        # None, Frontal, Temporal, Parietal, Occipital
      class_names: ['None', 'Frontal', 'Temporal', 'Parietal', 'Occipital']

# --- Training Parameters ---
training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5

# --- Loss Weights for Multi-Task Learning ---
# Simple static weights. The train script uses dynamic normalization as per the blueprint.
  loss_weights:
    rhythm: 1.0
    artifact: 1.5   # Weight artifacts slightly higher
    pathology: 2.0  # Weight pathology detection highest
    localization: 1.0