# In file: config/config.yaml

paths:
  chb_mit_dir: '/shares/CC_v_Val_FV_Gen3_all/VIDT_DL/data/cnn_training/projects/smart_data_selection/town_signs/data/public/chbmit'
  dataset_split_file: 'config/dataset_split.json'
  output_dir: 'outputs/'
  model_save_dir: 'saved_models/'

preprocessing:
  sfreq: 256
  l_freq: 0.5
  h_freq: 70.0
  notch_freq: 60.0
  epoch_duration_s: 10
  epoch_overlap_s: 5
  montage: 'standard_1020'
  reject_threshold_uv: 500
  # The 'reject_threshold_uv' key is now permanently removed.

model:
  # ... (model section remains the same) ...
  num_eeg_channels: 21
  sequence_length: 2560
  cnn_out_channels: 64
  transformer_heads: 8
  transformer_layers: 6
  transformer_ff_dim: 1024 #was 1024!
  dropout: 0.2
  tasks:
    # PRIMARY TASK FOR HEADLINE METRICS
    seizure_binary:
      num_classes: 2
      class_names: ['non-seizure', 'seizure']

    # SECONDARY, MORE ADVANCED TASK
    epileptiform_event:
      num_classes: 6
      class_names: ['bkgd', 'gnsz', 'fnsz', 'spsw', 'gped', 'pled']
      # bkgd: background, gnsz: generalized seizure, fnsz: focal seizure,
      # spsw: spike and wave, gped: generalized periodic discharges, pled: periodic lateralized discharges
      
    # AUXILIARY TASK
    artifact:
      num_classes: 5
      class_names: ['eyem', 'chew', 'shiv', 'musc', 'elpp']
      # eyem: eye movement, chew: chewing, shiv: shivering, musc: muscle, elpp: electrode pop

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5
  loss_weights:
    rhythm: 1.0
    artifact: 1.5
    pathology: 2.0
    localization: 1.0
  
  # NEW: Section for multi-process data loading
  data_loader:
    # Use n-1 cores for data loading, leaving one for the main process.
    # For an 8-core machine, use 7. For a 4-core, use 3.
    # Set to 0 to disable multi-processing if you encounter issues.
    num_workers: 16