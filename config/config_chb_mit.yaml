# ===================================================================
# FINAL SOTA CONFIGURATION FOR CHB-MIT
# ===================================================================

paths:
  # This path is used by the local preprocessing script
  chb_mit_raw_dir: 'C:\Temp\chbmit_tmp\physionet.org\files\chbmit\1.0.0'
  
  # This path is where the local script will SAVE the processed data
  chb_mit_processed_dir: 'C:\Temp\chbmit_processed'
  
  # This path is used by the TRAINING server
  preprocessed_data_dir: '/path/on/server/to/chbmit_processed'
  
  # These paths are used by helper scripts (prepare_dataset, evaluate)
  dataset_split_file: 'config/dataset_split_chbmit.json'
  output_dir: 'outputs/'
  model_save_dir: 'saved_models/'

preprocessing:
  sfreq: 256
  l_freq: 0.5
  h_freq: 70.0
  notch_freq: 60.0 # Use 50.0 for Europe
  epoch_duration_s: 10
  epoch_overlap_s: 5
  montage: 'standard_1020'

model:
  num_eeg_channels: 21
  sequence_length: 2560
  cnn_out_channels: 64
  transformer_heads: 8
  transformer_layers: 6
  transformer_ff_dim: 512
  dropout: 0.2
  tasks:
    seizure_binary:
      num_classes: 2
      class_names: ['non-seizure', 'seizure']
    artifact:
      num_classes: 2 # Artifact vs. Not Artifact
      class_names: ['clean', 'artifact']
    # We remove other heads as CHB-MIT doesn't have those labels
    
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5
  loss_weights:
    seizure_binary: 2.0
    artifact: 1.5
  data_loader:
    num_workers: 8